[package]
name = "thoth-desktop"
version = "0.1.0"
description = "Thoth desktop shell: runs the local server and shows it in a native window"
edition = "2021"
publish = false

[lib]
name = "thoth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only: no TLS stack.
ureq = { version = "3.5.2", default-features = false }
url = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
