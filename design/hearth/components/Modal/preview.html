<!-- @dsCard group="Overlays" height=300 subtitle="Confirm dialog over scrim" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
</head>
<body>
  <div class="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 class="modal__title" id="m-title">Delete this project?</h2>
      <p class="modal__body">Its 12 files and history will be removed for everyone. You cannot undo this.</p>
      <div class="modal__actions">
        <button class="btn btn--ghost">Cancel</button>
        <button class="btn btn--danger">Delete project</button>
      </div>
    </div>
  </div>
</body>
</html>
