<!-- @dsCard group="Patterns" height=380 subtitle="Messages and composer" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&display=swap">
</head>
<body>
  <div class="thread">
    <div class="msg--user">Can you help me plan a calm weekend in Da Lat?</div>
    <div class="msg--assistant">
      Happily. Start slow: a late breakfast, a walk around the lake, and one thing booked per day so the rest stays open. Tell me what pace you like and I will shape the days around it.
    </div>
    <div class="composer">
      <input class="composer__input" placeholder="Reply to the conversation" aria-label="Message">
      <button class="composer__send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
