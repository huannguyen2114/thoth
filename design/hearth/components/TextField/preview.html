<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&display=swap">
</head>
<body>
  <div class="row" style="align-items:flex-start;gap:24px">
    <label class="field">
      <span class="field__label">Project name</span>
      <input class="field__input" placeholder="Untitled project">
      <span class="field__help">You can rename it later.</span>
    </label>
    <label class="field field--error">
      <span class="field__label">Email</span>
      <input class="field__input" value="ngoc@example">
      <span class="field__help">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8v3.8M8 11v.1"/></svg>
        Enter a full address, like name@domain.com.
      </span>
    </label>
  </div>
</body>
</html>
