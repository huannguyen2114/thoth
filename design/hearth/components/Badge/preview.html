<!-- @dsCard group="Status" height=130 subtitle="Neutral, accent and four statuses" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&display=swap">
</head>
<body>
  <div class="row">
    <span class="badge badge--neutral">Draft</span>
    <span class="badge badge--accent">New</span>
    <span class="badge badge--success">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>Published
    </span>
    <span class="badge badge--warning">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v6M8 12.2v.1"/></svg>Needs review
    </span>
    <span class="badge badge--danger">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>Failed
    </span>
    <span class="badge badge--info">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 7.2V12M8 4.2v.1"/></svg>Beta
    </span>
  </div>
</body>
</html>
