<!-- @dsCard group="Surfaces" height=240 subtitle="Flat and lifted" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&display=swap">
</head>
<body>
  <div class="row" style="align-items:stretch;gap:24px">
    <div class="card">
      <h3 class="card__title">Weekly review</h3>
      <p class="card__body">Look back at what shipped, what slipped, and what to carry into next week.</p>
      <div class="card__actions">
        <button class="btn btn--primary btn--sm">Start</button>
        <button class="btn btn--ghost btn--sm">Later</button>
      </div>
    </div>
    <div class="card card--raised">
      <h3 class="card__title">Reading list</h3>
      <p class="card__body">Eight pieces saved. Two take under five minutes.</p>
      <div class="card__actions">
        <span class="badge badge--accent">New</span>
      </div>
    </div>
  </div>
</body>
</html>
