<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
</head>
<body>
  <label class="field">
    <span class="field__label">Language</span>
    <span class="select-wrap">
      <select class="select">
        <option>Tiếng Việt</option>
        <option selected>English</option>
        <option>日本語</option>
      </select>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </span>
  </label>
</body>
</html>
