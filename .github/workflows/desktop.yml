# Desktop app builds (ADR-0036, docs/technical_design/19-desktop-app.md).
# Each target builds on its own runner, because the server's native modules (libSQL, ONNX Runtime,
# sharp) come from that runner's install. Builds are not code-signed yet, but when the updater
# key is set up (ADR-0049) their update bundles are signed, a latest.json is published for the
# in-app updater, and the Homebrew cask in Casks/ is bumped.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Node sidecar and standalone server
        run: pnpm --filter @thoth/desktop prepare-sidecar --target ${{ matrix.target }}

      # tauri-build checks that the sidecar exists, so the Rust tests run after it is prepared.
      - name: Shell unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

      - name: Smoke test the bundled server (headless)
        run: pnpm --filter @thoth/desktop smoke

      # Update signing (ADR-0049): the private key signs the update bundles; the public key is
      # compiled into the app. Without them the build still works, without in-app updates.
      - name: Build the app
        working-directory: apps/desktop
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            # The CLI checks the config's public key when it signs, so the key goes in too. A file,
            # not inline JSON: Windows strips the quotes from an inline --config.
            node -e 'require("fs").writeFileSync("updater.conf.json", JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.TAURI_UPDATER_PUBKEY.trim()}}}))'
            node scripts/tauri.mjs build --target ${{ matrix.target }} --config updater.conf.json
          elif [ -n "$TAURI_SIGNING_PRIVATE_KEY$TAURI_UPDATER_PUBKEY" ]; then
            echo "::error::Set both the TAURI_SIGNING_PRIVATE_KEY secret and the TAURI_UPDATER_PUBKEY variable, or neither."
            exit 1
          else
            echo "::warning::No updater key: this build cannot update itself (ADR-0049)."
            node scripts/tauri.mjs build --target ${{ matrix.target }}
          fi

      - name: Smoke test the server inside the built .app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: node scripts/smoke.mjs --app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Thoth.app"

      # Stable names, so the landing page can link to releases/latest/download/<name> (ADR-0045).
      - name: Collect installers under stable names
        env:
          BUNDLE: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          mkdir -p dist
          # An update bundle's signature, when the build was signed.
          sig() { if [ -f "$1.sig" ]; then cp "$1.sig" "dist/$2.sig"; fi; }
          case "${{ matrix.target }}" in
            aarch64-apple-darwin | x86_64-apple-darwin)
              arch=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo arm64 || echo x64)
              cp "$BUNDLE"/dmg/*.dmg "dist/Thoth-macOS-$arch.dmg"
              if [ -f "$BUNDLE/macos/Thoth.app.tar.gz" ]; then
                cp "$BUNDLE/macos/Thoth.app.tar.gz" "dist/Thoth-macOS-$arch.app.tar.gz"
                sig "$BUNDLE/macos/Thoth.app.tar.gz" "Thoth-macOS-$arch.app.tar.gz"
              fi ;;
            x86_64-pc-windows-msvc)
              cp "$BUNDLE"/msi/*.msi dist/Thoth-Windows-x64.msi
              exe=$(ls "$BUNDLE"/nsis/*.exe | head -1)
              cp "$exe" dist/Thoth-Windows-x64-setup.exe
              sig "$exe" Thoth-Windows-x64-setup.exe ;;
            x86_64-unknown-linux-gnu)
              img=$(ls "$BUNDLE"/appimage/*.AppImage | head -1)
              cp "$img" dist/Thoth-Linux-x86_64.AppImage
              sig "$img" Thoth-Linux-x86_64.AppImage
              cp "$BUNDLE"/deb/*.deb dist/Thoth-Linux-amd64.deb ;;
          esac
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: thoth-${{ matrix.target }}
          if-no-files-found: error
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # latest.json for the in-app updater, and the Homebrew cask (ADR-0049).
      - name: Updater manifest and Homebrew cask
        run: |
          node apps/desktop/scripts/release-files.mjs --dir dist \
            --version "${GITHUB_REF_NAME#v}" --repo "${{ github.repository }}" \
            --notes "See https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          brew style --cask Casks/thoth.rb || echo "::warning::brew style found issues in Casks/thoth.rb"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # Homebrew reads the cask from main, so the new version and checksums are committed there.
      - name: Bump the Homebrew cask on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/thoth.rb
          if git diff --cached --quiet; then echo "Cask unchanged."; exit 0; fi
          git commit -m "chore(brew): thoth ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
