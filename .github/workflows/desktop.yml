# Desktop app builds (ADR-0036, docs/technical_design/19-desktop-app.md).
# Each target builds on its own runner, because the server's native modules (libSQL, ONNX Runtime,
# sharp) come from that runner's install. Builds are unsigned for now.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Node sidecar and standalone server
        run: pnpm --filter @thoth/desktop prepare-sidecar --target ${{ matrix.target }}

      # tauri-build checks that the sidecar exists, so the Rust tests run after it is prepared.
      - name: Shell unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

      - name: Smoke test the bundled server (headless)
        run: pnpm --filter @thoth/desktop smoke

      - name: Build the app
        working-directory: apps/desktop
        run: node scripts/tauri.mjs build --target ${{ matrix.target }}

      - name: Smoke test the server inside the built .app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: node scripts/smoke.mjs --app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Thoth.app"

      # Stable names, so the landing page can link to releases/latest/download/<name> (ADR-0045).
      - name: Collect installers under stable names
        env:
          BUNDLE: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) cp "$BUNDLE"/dmg/*.dmg dist/Thoth-macOS-arm64.dmg ;;
            x86_64-apple-darwin) cp "$BUNDLE"/dmg/*.dmg dist/Thoth-macOS-x64.dmg ;;
            x86_64-pc-windows-msvc)
              cp "$BUNDLE"/msi/*.msi dist/Thoth-Windows-x64.msi
              cp "$BUNDLE"/nsis/*.exe dist/Thoth-Windows-x64-setup.exe ;;
            x86_64-unknown-linux-gnu)
              cp "$BUNDLE"/appimage/*.AppImage dist/Thoth-Linux-x86_64.AppImage
              cp "$BUNDLE"/deb/*.deb dist/Thoth-Linux-amd64.deb ;;
          esac
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: thoth-${{ matrix.target }}
          if-no-files-found: error
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, refs/tags/v)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
