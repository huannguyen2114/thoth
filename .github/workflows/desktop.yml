# Desktop app builds (ADR-0036, docs/technical_design/19-desktop-app.md).
# Each target builds on its own runner, because the server's native modules (libSQL, ONNX Runtime,
# sharp) come from that runner's install. Builds are unsigned for now.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Shell unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

      - name: Node sidecar and standalone server
        run: pnpm --filter @thoth/desktop prepare-sidecar --target ${{ matrix.target }}

      - name: Smoke test the bundled server (headless)
        run: pnpm --filter @thoth/desktop smoke

      - name: Build the app
        working-directory: apps/desktop
        run: node scripts/tauri.mjs build --target ${{ matrix.target }}

      - name: Smoke test the server inside the built .app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: node scripts/smoke.mjs --app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Thoth.app"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: thoth-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
